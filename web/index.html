<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="travelyn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>travelyn</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fallback Fonts & Emojis for Flutter Web CanvasKit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    // Suppress non-fatal CanvasKit font fallback warning in developer console
    (function() {
      const filterStr = "Could not find a set of Noto fonts";
      const wrap = function(original) {
        return function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && arguments[0].indexOf(filterStr) !== -1) {
            return;
          }
          return original.apply(console, arguments);
        };
      };
      console.log = wrap(console.log);
      console.warn = wrap(console.warn);
      console.error = wrap(console.error);
      console.info = wrap(console.info);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
